domain_id: epoch_manager
normative: NORMATIVE.md
verification: VERIFICATION.md
items:
  - id: MGR-001
    section: "EpochManager Struct"
    summary: "EpochManager uses parking_lot::RwLock<EpochManagerInner> with network_id, genesis_l1_height, current_epoch, competition, summaries, rewards"
    status: verified
    spec_ref: "Section 6.1"
    tests:
      - tests/epoch_manager/mgr_001_test.rs
    completion_date: "2026-04-16"
    notes: "Inner struct has 6 fields (MGR-001 spec's 5 plus rewards HashMap for MGR-005/008). Concurrent-read and exclusive-write smoke tests included. 6 tests."

  - id: MGR-002
    section: "record_block"
    summary: "record_block increments blocks_produced, total_fees, total_transactions; requires BlockProduction phase"
    status: verified
    spec_ref: "Section 6.4"
    tests:
      - tests/epoch_manager/mgr_002_test.rs
    completion_date: "2026-04-16"
    notes: "Single, accumulating, zero-value, and PhaseMismatch rejection. 4 tests."

  - id: MGR-003
    section: "set_current_epoch_chain_totals"
    summary: "Overwrites blocks_produced, total_fees, total_transactions for resync/correction without incrementing"
    status: verified
    spec_ref: "Section 6.4"
    tests:
      - tests/epoch_manager/mgr_003_test.rs
    completion_date: "2026-04-16"
    notes: "Overwrite semantics, idempotency, no phase restriction, zeros. 6 tests."

  - id: MGR-004
    section: "advance_epoch"
    summary: "Verifies Complete phase and finalized checkpoint, archives EpochSummary, creates new EpochInfo for epoch+1, resets competition"
    status: verified
    spec_ref: "Section 6.7"
    tests:
      - tests/epoch_manager/mgr_004_test.rs
    completion_date: "2026-04-16"
    notes: "EpochNotComplete + NoFinalizedCheckpoint preconditions, multi-advance ordering, BLOCKS_PER_EPOCH L2 stride. 9 tests."

  - id: MGR-005
    section: "Query Methods"
    summary: "get_epoch_info, get_epoch_summary, recent_summaries, total_stats, get_rewards query methods"
    status: verified
    spec_ref: "Section 6.9"
    tests:
      - tests/epoch_manager/mgr_005_test.rs
    completion_date: "2026-04-16"
    notes: "Snapshot semantics, tail/partial/zero for recent_summaries, total_stats includes current. 9 tests."

  - id: MGR-006
    section: "DFSP Close Snapshot"
    summary: "set_current_epoch_dfsp_close_snapshot sets DFSP close data on current EpochInfo; requires Finalization phase"
    status: verified
    spec_ref: "Section 6.6"
    tests:
      - tests/epoch_manager/mgr_006_test.rs
    completion_date: "2026-04-16"
    notes: "Copies all 7 snapshot fields, rejects in 3 off-phases, overwrites, survives archival. 6 tests."

  - id: MGR-007
    section: "Epoch History Management"
    summary: "Completed epochs archived as EpochSummary in order; append-only; recent_summaries from tail"
    status: verified
    spec_ref: "Section 6.7"
    tests:
      - tests/epoch_manager/mgr_007_test.rs
    completion_date: "2026-04-16"
    notes: "Ascending order, consecutive numbers, append-only monotonic length, content match. 5 tests."

  - id: MGR-008
    section: "Core Instance Methods"
    summary: "current_epoch, current_epoch_info, current_phase, genesis_l1_height, network_id, epoch_for_l1_height, l1_range_for_epoch, store_rewards"
    status: verified
    spec_ref: "Sections 6.3, 6.8, 6.9"
    tests:
      - tests/epoch_manager/mgr_008_test.rs
    completion_date: "2026-04-16"
    notes: "All 8 accessors incl. rewards store/retrieve round-trip. 8 tests."
